name: mail-test

# Temporary manual send-path test of the CT-Monitor SMTP secrets.
# Added 2026-07-25 to prove the GitHub secret SMTP_PASS and the 1984.is send
# path still work. To be deleted immediately after the test run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send a test alert through the real production secrets
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_SUBJECT: 'CT-Monitor SEND-PATH TEST 2026-07-25 (please ignore)'
        run: |
          echo "Manual send-path test of the CT-Monitor SMTP secrets, triggered 2026-07-25 on a GitHub runner. If you received this mail, the GitHub secret SMTP_PASS and the mail.1984.is send path are valid. No new certificate was detected; this is only a test." | python3 scripts/mail_alert.py
